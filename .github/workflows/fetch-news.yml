name: Fetch news

on:
  schedule:
    # 06:00 UTC daily (08:00 in the Netherlands during CEST, 07:00 during CET)
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install feedparser anthropic --break-system-packages

      - name: Run fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python news_automation/fetch_news.py

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- assets/news_data.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/news_data.json
          git commit -m "Update noticias: automated news fetch"
          git push
